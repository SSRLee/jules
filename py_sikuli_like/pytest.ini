[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Add options like --cov=pysikulix for coverage if desired later
# For now, ensure test discovery works.
# Add a log_cli line to see logs during test runs by default at INFO level
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)s)
log_date_format = %Y-%m-%d %H:%M:%S
